en:{i:["Academic and institutional activity",["Professor at the School of the Federal Judiciary of the 1st Region (Legal Amazon); guest professor in the Agribusiness Law specialization course at the Federal University of Mato Grosso and in the Business Law MBA at FUNDACE-USP.","Permanent Professor and Researcher in the Doctorate and Master's Programs in Business Law at UNINOVE; leader of the CNPq research groups <i>Legal Protection of Companies under Constitutional Environmental Law</i> and <i>Regulation and Transnational Company</i>; guest researcher in the City Law (UERJ) and Environmental Democracy (UFSCar) groups.","Supervised 200 master's dissertations and doctoral theses in Law. Scientific advisor to FAPESP.","Academic Director of the Congress of Contemporary Environmental Law Spain/Brazil (University of Salamanca) and member of the Procedural Studies Group (IUDICIUM) of the University of Salamanca; guest professor at the School of Technology of the Polytechnic Institute of Tomar (Portugal), where he holds the annual Luso-Brazilian Congress on Human Rights in the Information Society.","Twice President of the Standing Environment Committee of the OAB/SP (2013/2015 and 2016/2018) and, over the same period, President of the Committee for the Defense of Human Dignity in the Digital Environment of the Human Rights Commission; OAB/SP representative on the Management Council of the State Fund for the Defense of Diffuse Interests, the State Fund for Prevention and Remediation of Contaminated Areas and the Tietê River Basin Committee; designer, coordinator and professor of the Environmental Law Specialization Course of the OAB/SP School of Advocacy.","Holder of Chair 43 (patron Sylvio Marcondes) of the Paulista Academy of Law; Chancellor of the Academy of Human Rights.","Scientific boards: Revista Americana de Urbanismo (Madrid), the Legal Studies series of Ediciones Universidad de Salamanca, and the Istituto Internazionale di Ricerca sui Beni Comuni (Paris/Rome).","Awarded the Brazilian Army Medal for outstanding work in defense of the environment."]],b:["Published books","Brazil","Spain","Portugal"]},
es:{i:["Actividad académica e institucional",["Profesor de la Escuela de la Magistratura Federal de la 1.ª Región (Amazonía Legal); profesor invitado del Curso de Especialización en Derecho del Agronegocio de la Universidad Federal de Mato Grosso y del MBA en Derecho Empresarial de FUNDACE-USP.","Profesor Permanente e Investigador de los Programas de Doctorado y Máster en Derecho Empresarial de UNINOVE; líder de los grupos de investigación del CNPq <i>Tutela Jurídica de las Empresas ante el Derecho Ambiental Constitucional</i> y <i>Regulación y Empresa Transnacional</i>; investigador invitado de los grupos de Derecho de la Ciudad (UERJ) y Democracia Ambiental (UFSCar).","Dirigió 200 disertaciones y tesis de Máster y Doctorado en Derecho. Asesor científico de FAPESP.","Director Académico del Congreso de Derecho Ambiental Contemporáneo España/Brasil (Universidad de Salamanca) y miembro del Grupo de Estudios Procesales (IUDICIUM) de la Universidad de Salamanca; profesor invitado de la Escuela Superior de Tecnología del Instituto Politécnico de Tomar (Portugal), donde realiza anualmente el Congreso Luso-Brasileño de Derechos Humanos en la Sociedad de la Información.","Dos veces Presidente de la Comisión Permanente del Medio Ambiente de la OAB/SP (2013/2015 y 2016/2018) y, en el mismo período, Presidente del Comité de Defensa de la Dignidad de la Persona Humana en el ámbito del Medio Ambiente Digital de la Comisión de Derechos Humanos; representante de la OAB/SP en el Consejo Gestor del Fondo Estatal de Defensa de los Intereses Difusos, del Fondo Estatal para la Prevención y Remediación de Áreas Contaminadas y del Comité de la Cuenca Hidrográfica del Tietê; elaborador, coordinador y profesor del Curso de Especialización en Derecho Ambiental de la Escuela Superior de la Abogacía de la OAB/SP.","Titular de la cátedra 43 (patrono Sylvio Marcondes) de la Academia Paulista de Derecho; Canciller de la Academia de Derechos Humanos.","Consejos científicos: Revista Americana de Urbanismo (Madrid), colección de Estudios Jurídicos de Ediciones Universidad de Salamanca e Istituto Internazionale di Ricerca sui Beni Comuni (París/Roma).","Condecorado con la Medalla Ejército Brasileño por su destacada actuación en defensa del medio ambiente."]],b:["Libros publicados","Brasil","España","Portugal"]},
zh:{i:["学术与机构活动",["巴西联邦第一大区法官学院（合法亚马逊地区）教授；马托格罗索联邦大学农业企业法专修课程及圣保罗大学FUNDACE企业法MBA客座教授。","UNINOVE企业法博士与硕士项目常任教授和研究员；CNPq研究团队《企业在宪法环境法下的法律保护》和《监管与跨国公司》负责人；城市法（UERJ）与环境民主（UFSCar）研究团队受邀研究员。","指导硕士、博士法学论文共200篇。圣保罗研究基金会（FAPESP）科学顾问。","西班牙／巴西当代环境法大会（萨拉曼卡大学）学术主任，萨拉曼卡大学诉讼法研究小组（IUDICIUM）成员；葡萄牙托马尔理工学院高等技术学院客座教授，每年主办葡巴信息社会人权大会。","两度出任圣保罗律师协会（OAB/SP）环境常设委员会主席（2013/2015与2016/2018），同期任人权委员会数字环境中人类尊严保护委员会主席；OAB/SP驻州扩散性利益保护基金、污染区域预防与修复州基金及蒂特河流域委员会管理理事会代表；OAB/SP律师高等学院环境法专修课程的设计者、协调人和教授。","保利斯塔法学院第43席院士（庇护人Sylvio Marcondes）；人权学院校长（Chanceler）。","科学委员会成员：《美洲城市规划杂志》（马德里）、萨拉曼卡大学出版社法学研究丛书，以及共有物国际研究所（巴黎／罗马）。","因捍卫环境的突出贡献荣获巴西陆军勋章。"]],b:["已出版著作","巴西","西班牙","葡萄牙"]}};
